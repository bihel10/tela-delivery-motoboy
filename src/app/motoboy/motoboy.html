<div class="motoboy-container">
  <header class="header">
    <h2>Corrida Disponível</h2>
  </header>

  <div class="card">
    <div class="info-row">
      <span class="label">Restaurante:</span>
      <span class="value">Pizza & Cia</span>
    </div>

    <div class="info-row">
      <span class="label">Endereço para retirada:</span>
      <span class="value">Av. Paulista, 900</span>
    </div>

    <div class="info-row">
      <span class="label">Entrega:</span>
      <span class="value">Rua das Flores, 245</span>
    </div>

    <div class="info-row">
      <span class="label">Distância total:</span>
      <span class="value">4,3 km</span>
    </div>

    <button class="accept-btn" (click)="aceitarCorrida()">
      Aceitar corrida
    </button>
  </div>
</div>
